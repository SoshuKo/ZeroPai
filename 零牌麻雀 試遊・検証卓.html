<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>零牌麻雀 試遊卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E8E3;--panel:#F5F6F2;--panel2:#ECEFEA;--ink:#1D2530;--mute:#5A6472;--line:#C6CCC4;
  --table:#25384A;--table2:#1C2C3C;--tink:#D7DFE7;--tmute:#8EA0B2;
  --tile:#FBF8EF;--tedge:#D5CCB6;--back:#3D776B;
  --man:#B0342A;--pin:#22508E;--sou:#2B784A;--zero:#B3851F;--warn:#A33A2C;
  --btn:#1D2530;--btnink:#F5F6F2;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP",serif;
  --bw:min(calc(100vw - 20px),560px);
  --rt:calc(var(--bw) * .0633);
  --ht:min(calc((100vw - 44px) / 15.8),40px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131920;--panel:#1B232C;--panel2:#212B36;--ink:#E3E7EB;--mute:#97A1AD;--line:#2E3945;
    --table:#1C2B3A;--table2:#15212D;--btn:#E3E7EB;--btnink:#131920;--warn:#E07A6A;
  }
}
:root[data-theme="dark"]{
  --bg:#131920;--panel:#1B232C;--panel2:#212B36;--ink:#E3E7EB;--mute:#97A1AD;--line:#2E3945;
  --table:#1C2B3A;--table2:#15212D;--btn:#E3E7EB;--btnink:#131920;--warn:#E07A6A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--zero);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:8px;flex:none;padding:4px 0 2px 6px;font-family:var(--mincho);font-weight:800;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.brand .ens{position:relative;display:inline-block}
.brand .ens::before{content:"";position:absolute;left:50%;top:52%;width:1.3em;height:1.3em;transform:translate(-50%,-50%) rotate(-30deg);border:2.5px solid var(--zero);border-top-color:transparent;border-radius:50%;opacity:.85}
.brand small{font-family:var(--ui);font-weight:400;font-size:12px;color:var(--mute);letter-spacing:0}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:6px 10px;border-radius:6px;white-space:nowrap;cursor:pointer;color:var(--mute);font-size:14px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--panel2);font-weight:700}
@media (max-width:640px){.topin{flex-wrap:wrap;gap:4px 10px;padding:6px 10px}.brand{font-size:19px}nav.tabs{flex-basis:100%;order:2;margin:0 -4px}}

main{max-width:1180px;margin:0 auto;padding:12px 10px 40px}
section[hidden]{display:none!important}
h2{font-family:var(--mincho);font-weight:800;font-size:22px;margin:4px 0 10px;letter-spacing:.02em}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.mute{color:var(--mute)}
.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.field>span{font-size:13px;color:var(--mute)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:10px;font-size:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
.btn.gold{background:var(--zero);color:#fff;border-color:var(--zero);font-weight:700}
.btn.warn{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:13px}
.seatsel{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}

/* tiles */
.tl{--tw:var(--ht);position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--tw);height:calc(var(--tw) * 1.34);background:var(--tile);border-radius:calc(var(--tw) * .13);box-shadow:inset 0 calc(var(--tw) * -.08) 0 var(--tedge),0 1px 1px rgba(0,0,0,.35);font-family:var(--mincho);line-height:1;color:#1D2530;vertical-align:bottom;user-select:none}
.tl .fc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--tw);height:calc(var(--tw) * 1.34);padding-bottom:calc(var(--tw) * .06)}
.tl .n{font-size:calc(var(--tw) * .64);font-weight:800}
.tl .su{font-size:calc(var(--tw) * .34);font-style:normal;font-weight:800;margin-top:calc(var(--tw) * .02)}
.tl .s0{color:var(--man)}.tl .s1{color:var(--pin)}.tl .s2{color:var(--sou)}
.tl.red .n{color:var(--man)}
.tl.red::after{content:"";position:absolute;top:calc(var(--tw) * .1);right:calc(var(--tw) * .1);width:calc(var(--tw) * .14);height:calc(var(--tw) * .14);border-radius:50%;background:var(--man)}
.tl .hz{font-size:calc(var(--tw) * .74);font-weight:800}
.tl .h5{color:var(--sou)}.tl .h6{color:var(--man)}
.tl .hk{display:block;width:calc(var(--tw) * .5);height:calc(var(--tw) * .7);border:calc(var(--tw) * .07) solid #6E8FB0;border-radius:2px}
.tl .ring{display:block;width:calc(var(--tw) * .66);height:calc(var(--tw) * .66);border-radius:50%;border:calc(var(--tw) * .12) solid var(--zero);border-top-color:transparent;transform:rotate(-32deg)}
.tl.back{background:var(--back);box-shadow:inset 0 calc(var(--tw) * -.08) 0 rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.35)}
.tl.yoko{width:calc(var(--tw) * 1.34);height:var(--tw);align-self:flex-end}
.tl.yoko .fc{transform:rotate(90deg)}
.tl.dim{opacity:.38}
.tl.hl{box-shadow:inset 0 calc(var(--tw) * -.08) 0 var(--tedge),0 0 0 2px var(--zero)}
.tl.inv{opacity:.5}
.tl.inv::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid var(--warn);transform:rotate(-30deg)}
.tl.sm{--tw:22px}.tl.xs{--tw:16px}
.tiles{display:inline-flex;flex-wrap:wrap;align-items:flex-end;gap:1px}

/* table layout */
.tbwrap{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1040px){.tbwrap{grid-template-columns:auto minmax(0,1fr);align-items:start}.tbwrap .board{margin:0}:root{--bw:min(calc(100vh - 140px),560px)}}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.toolbar .sp{flex:1}
.status{font-size:13px;color:var(--mute);min-height:1.6em}
.board{position:relative;width:var(--bw);height:var(--bw);margin:0 auto;background:var(--table);border-radius:14px;color:var(--tink)}
.board .center{position:absolute;top:31%;left:31%;width:38%;height:38%;background:var(--table2);border-radius:8px}
.board .layer{position:absolute;inset:0;pointer-events:none}
.board .river{position:absolute;top:69.4%;left:31%;width:38%}
.board .rrow{display:flex;align-items:flex-end;height:calc(var(--rt) * 1.3);gap:0}
.board .river .tl{--tw:var(--rt);height:calc(var(--rt) * 1.28);box-shadow:inset 0 -1px 0 var(--tedge),0 1px 0 rgba(0,0,0,.4)}
.board .river .tl .fc{height:calc(var(--rt) * 1.28)}
.board .river .tl.yoko{height:var(--rt);width:calc(var(--rt) * 1.28)}
.board .river .tl.last{box-shadow:0 0 0 2px var(--zero)}
.board .seatlab{position:absolute;top:63.2%;left:31%;width:38%;height:5.8%;display:flex;align-items:center;justify-content:center;gap:.5em;font-size:calc(var(--bw) * .03);color:var(--tmute);white-space:nowrap}
.board .seatlab b{color:var(--tink);font-weight:700}
.board .seatlab.on{color:var(--tink)}
.board .seatlab.on::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--zero)}
.board .seatlab .rb{display:inline-block;width:2.2em;height:.42em;border-radius:.2em;background:#F2EFE6;position:relative}
.board .seatlab .rb::after{content:"";position:absolute;left:50%;top:50%;width:.3em;height:.3em;margin:-.15em;border-radius:50%;background:var(--man)}
.board .cinfo{position:absolute;top:32%;left:32%;width:36%;height:30.6%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;font-size:calc(var(--bw) * .03);line-height:1.25;text-align:center}
.board .cinfo .rd{font-family:var(--mincho);font-weight:800;font-size:1.45em;color:#F1EDE2}
.board .cinfo .tl{--tw:calc(var(--bw) * .04)}
.board .cinfo .dr{display:flex;gap:2px}

.hands{display:flex;flex-direction:column;gap:8px;min-width:0}
.hrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hrow.turn{border-color:var(--zero)}
.hhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;margin-bottom:5px}
.hhead .wd{font-family:var(--mincho);font-weight:800;font-size:16px}
.hhead .sc{font-variant-numeric:tabular-nums;font-weight:700}
.hhead .rc{color:var(--man);font-weight:700}
.hhead .inf{color:var(--mute);font-size:12px}
.htiles{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 8px}
.htiles .cl{display:flex;align-items:flex-end;gap:1px}
.htiles .dw{margin-left:3px}
.htiles .mg{display:flex;align-items:flex-end;gap:1px}
.melds{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-left:auto}
.hrow.opp .tl{--tw:min(calc((100vw - 34px) / 17),30px)}
button.tl{border:0;padding:0;cursor:pointer;transition:transform .08s}
button.tl:hover:not(:disabled){transform:translateY(-3px)}
button.tl:disabled{cursor:default}
button.tl.ng{opacity:.4}
button.tl.rec{box-shadow:inset 0 calc(var(--tw) * -.08) 0 var(--tedge),0 3px 0 -1px var(--zero)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:34px;align-items:center}
.actions .btn{padding:7px 14px;font-size:15px}
.actions .opt{display:inline-flex;align-items:center;gap:6px}
.actions .opt .tl{--tw:18px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.hint b{color:var(--ink)}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 10px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}
.ov[hidden]{display:none}
.ovc{background:var(--panel);color:var(--ink);border-radius:12px;max-width:640px;width:100%;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ovc h3{font-family:var(--mincho);font-weight:800;font-size:20px;margin:0 0 8px}
.win{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.win:first-of-type{border-top:0;margin-top:0;padding-top:0}
.wt{font-weight:700;margin-bottom:6px}
.x0{display:inline-block;font-size:12px;font-weight:700;color:var(--zero);border:1.5px solid var(--zero);border-radius:999px;padding:0 7px;margin-left:6px;line-height:1.5}
.whand{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-bottom:8px}
.whand .tl{--tw:min(calc((100vw - 70px) / 16),30px)}
table.yk{border-collapse:collapse;font-size:14px;min-width:220px}
table.yk td{padding:1px 10px 1px 0}
table.yk td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.yk tr.zy td:first-child{color:var(--zero);font-weight:700}
.wsum{margin-top:6px;font-size:16px}
.wsum b{font-size:20px;font-family:var(--mincho)}
table.dt{border-collapse:collapse;width:100%;font-size:14px}
table.dt th,table.dt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.dt th{font-size:12px;color:var(--mute);font-weight:400}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--sou)}.neg{color:var(--warn)}
.scroll{overflow-x:auto}
.ovbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}

/* sim */
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--zero);width:0}
.bar{display:inline-block;height:10px;background:var(--pin);border-radius:2px;vertical-align:middle;opacity:.8}
.bar.z{background:var(--zero)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--panel2);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-family:var(--mincho)}
.kpi span{font-size:12px;color:var(--mute)}

/* history */
.hitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.hitem .ps{font-size:13px;color:var(--mute)}

/* calc */
.palette{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.palette button.tl{--tw:28px}
.calcout .tl{--tw:26px}
.tag{display:inline-block;font-size:12px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--mute)}

/* rules */
.rules{max-width:760px}
.rules p,.rules li{max-width:68ch}
.yaku-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px;font-size:14px}
.yaku-list div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line)}
.yaku-list .z{color:var(--zero);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><span><span class="ens">零</span>牌麻雀</span><small>試遊・検証卓</small></div>
  <nav class="tabs" aria-label="メニュー">
    <button data-view="table">卓</button>
    <button data-view="sim">シミュレーション</button>
    <button data-view="replay">リプレイ</button>
    <button data-view="history">履歴</button>
    <button data-view="calc">点数計算</button>
    <button data-view="rules">ルール・設定</button>
  </nav>
</div></header>
<main>
  <section id="v-table"></section>
  <section id="v-sim" hidden></section>
  <section id="v-replay" hidden></section>
  <section id="v-history" hidden></section>
  <section id="v-calc" hidden></section>
  <section id="v-rules" hidden></section>
</main>
<div class="ov" id="ov" hidden><div class="ovc" id="ovc" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
/* 零牌麻雀 エンジン */
const ZP = (() => {
const Z = 34, NT = 35;
const HN = ['東','南','西','北','白','發','中'];
const SU = ['m','p','s'];
const YAO = [0,8,9,17,18,26,27,28,29,30,31,32,33];
const DEFAULT_RULES = {
  length: 'hanchan', start: 25000, ret: 30000, uma: [20,10,-10,-20],
  red: true, kuitan: true, tobi: true, abortive: true, kyuushuZero: true,
  kazoe: true, multiYakuman: true, doubleRon: true, agariyame: true
};
const STYLES = { std: '標準', zero: '零寄り', speed: '速攻', def: '守備' };

/* ---------- tiles ---------- */
const tType = id => id >= 136 ? 34 : (id >> 2);
const isRedId = (id, R) => !!(R && R.red) && (id === 16 || id === 52 || id === 88);
function typeCode(t){ if (t === 34) return '0'; if (t >= 27) return (t - 26) + 'z'; return (t % 9 + 1) + SU[(t / 9) | 0]; }
function idCode(id, R){ const t = tType(id); return isRedId(id, R) ? 'r' + typeCode(t) : typeCode(t); }
function typeName(t){ if (t === 34) return '零'; if (t >= 27) return HN[t - 27]; return (t % 9 + 1) + '萬筒索'[(t / 9) | 0]; }
function parseCode(s){
  s = String(s).trim();
  if (s === '0' || s === '0z' || s === '零' || /^z0$/i.test(s)) return { t: 34, red: false };
  let red = false;
  if (/^r/i.test(s)) { red = true; s = s.slice(1); }
  const m = s.match(/^([0-9])([mpsz])$/i);
  if (m) {
    let n = +m[1]; const su = m[2].toLowerCase();
    if (su === 'z') { if (n === 0) return { t: 34, red: false }; if (n > 7) return null; return { t: 26 + n, red: false }; }
    if (n === 0) { n = 5; red = true; }
    return { t: (n - 1) + 9 * 'mps'.indexOf(su), red: red && n === 5 };
  }
  const hi = HN.indexOf(s);
  if (hi >= 0) return { t: 27 + hi, red: false };
  return null;
}
/* 手牌表記: 123m 901s 000 東東東 r5p 等。グループ内の 0 は零牌 */
function parseHandStr(str){
  const out = []; let pend = [];
  const flush = (force) => {
    if (!pend.length) return;
    if (pend.every(p => p.d === 0)) { pend.forEach(() => out.push({ t: 34, red: false })); pend = []; }
    else if (force) throw new Error('数字の後に m / p / s / z を付けてください');
  };
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === 'r' || ch === 'R') {
      const nx = str[i + 1];
      if (nx && /[1-9]/.test(nx)) { pend.push({ d: +nx, red: true }); i++; continue; }
      throw new Error('r の後には数字を書いてください (例: r5m)');
    }
    if (/[0-9]/.test(ch)) { pend.push({ d: +ch, red: false }); continue; }
    if (/[mpsz]/i.test(ch)) {
      const su = ch.toLowerCase();
      if (!pend.length) throw new Error(`「${ch}」の前に数字がありません`);
      for (const p of pend) {
        if (p.d === 0) out.push({ t: 34, red: false });
        else if (su === 'z') { if (p.d > 7) throw new Error('字牌は 1z〜7z です'); out.push({ t: 26 + p.d, red: false }); }
        else out.push({ t: (p.d - 1) + 9 * 'mps'.indexOf(su), red: p.red && p.d === 5 });
      }
      pend = []; continue;
    }
    const hi = HN.indexOf(ch);
    if (hi >= 0) { flush(true); out.push({ t: 27 + hi, red: false }); continue; }
    if (ch === '零' || ch === '〇') { flush(true); out.push({ t: 34, red: false }); continue; }
    if (/[\s,、]/.test(ch)) { flush(false); continue; }
    throw new Error(`「${ch}」を読めません`);
  }
  flush(true);
  return out;
}
function countsOfTypes(ts){ const c = new Array(NT).fill(0); for (const t of ts) c[t]++; return c; }
function countsOf(ids){ const c = new Array(NT).fill(0); for (const id of ids) c[tType(id)]++; return c; }
const isHonor = t => t >= 27 && t <= 33;
const isTerm = t => t < 27 && (t % 9 === 0 || t % 9 === 8);
const isYao = t => t >= 27 || (t % 9 === 0 || t % 9 === 8); // 零を含む(34>=27)
const isSimple = t => t < 27 && t % 9 >= 1 && t % 9 <= 7;
function doraNext(t){
  if (t === 34) return -1;

  if (humanSeat >= 0) hands += handRowHTML(G, humanSeat, { me: true, face: true, info: App.settings.hint });
  for (const s of order) {
    if (s === humanSeat) continue;
    const face = App.mode !== 'play' ? App.showHands : App.showHands;
    if (App.mode === 'play' && !face) continue;
    hands += handRowHTML(G, s, { me: false, face, info: face });
  }
  let res = '';
  if (App.mode === 'replay' && G.K.phase === 'end') res = `<div class="hrow">${resultHTML(G, G.K.result)}</div>`;
  if (G.over && App.mode === 'replay') res += `<div class="hrow">${finalHTML(G)}</div>`;
  root.innerHTML = `${tableToolbar()}<div class="status">${status}</div><div class="tbwrap">${boardHTML(G, bottom)}<div class="hands">${hands}${res}</div></div>`;
}

function startLive(mode, players, hs, G){
  App.token++;
  if (!G) { G = ZP.newGame({ rules: App.settings.rules, players, mode }); ZP.startKyoku(G); }
  App.G = G; App.mode = mode; App.humanSeat = hs; App.viewSeat = hs >= 0 ? hs : 0;
  App.showHands = mode !== 'play'; App.paused = false; App.await = null; App.replay = null;
  App.agents = G.players;
  setView('table');
  gameLoop(App.token);
}

/* ----- live game loop ----- */
async function pace(token){
  if (App.mode === 'play') { await sleep(App.settings.cpuDelay); return; }
  await sleep(App.settings.speed);
  while (App.paused && !App.stepOnce && token === App.token) await sleep(60);
  App.stepOnce = false;
}
function hintFor(G, seat, p){
  try {
    const pk = ZP.chooseDiscard(G, seat, p.opts.discards, 'std');
    const K = G.K, c = ZP.countsOf(K.hands[seat]); c[pk.t]--;
    let txt = `推奨打牌 <b>${ZP.typeName(pk.t)}</b>`;
    if (pk.sh === 0) { const w = ZP.waitsOf(c, K.melds[seat].length, ZP.heldCounts(K, seat)); txt += `　打牌後 聴牌（待ち ${w.map(ZP.typeName).join(' ')}）`; }
    else txt += `　打牌後 ${pk.sh}向聴`;
    if (pk.fold) txt += '　※降り推奨';
    return { rec: pk.id, txt };
  } catch (e) { return { rec: null, txt: '' }; }
}
function humanTurn(p){
  return new Promise(res => {
    const G = App.G, K = G.K, s = p.seat, o = p.opts;
    if (K.riichi[s] && !o.tsumo && !o.ankan.length) { setTimeout(() => res({ a: 'd', s, t: ZP.idCode(K.drawn, G.rules), g: 1 }), 450); App.await = { kind: 'turn', p, res: () => {} }; renderTable(); return; }
    const h = App.settings.hint ? hintFor(G, s, p) : { rec: null, txt: '' };
    App.await = { kind: 'turn', p, res, riichiMode: false, rec: h.rec, hintText: h.txt };
    renderTable();
  });
}
function humanReact(p, seat){
  return new Promise(res => { App.await = { kind: 'react', p, seat, res }; renderTable(); });
}
async function gameLoop(token){
  while (token === App.token) {
    const G = App.G; const p = ZP.pending(G);
    if (p.kind === 'over') { onGameOver(); return; }
    if (p.kind === 'end') {
      renderTable();
      await showKyokuResult(G, p.result, token);
      if (token !== App.token) return;
      ZP.nextKyoku(G); renderTable(); continue;
    }
    if (p.kind === 'turn') {
      const ag = App.agents[p.seat];
      let A;
      if (ag.type === 'human' && App.mode === 'play') { A = await humanTurn(p); App.await = null; }
      else { await pace(token); if (token !== App.token) return; A = ZP.AI.turn(G, p, ag.style); }
      if (token !== App.token) return;
      try { ZP.act(G, A); } catch (e) { toast(e.message); }
      renderTable(); continue;
    }
    // react / chankan
    const dec = {}; let humanSeat = -1;
    for (const k in p.opts) {
      const s = +k, ag = App.agents[s];
      if (ag.type === 'human' && App.mode === 'play') humanSeat = s;
      else dec[s] = ZP.AI.react(G, s, p.opts[s], ag.style);
    }
    if (humanSeat >= 0) {
      const o = p.opts[humanSeat];
      const cpuRon = Object.values(dec).some(d => d.a === 'ron');
      const cpuPon = Object.values(dec).some(d => d.a === 'pon' || d.a === 'minkan');
      let ask = true;
      if (!o.ron) {
        if (cpuRon) ask = false;
        else if (!o.pon && !o.minkan && cpuPon) ask = false;
        else if (App.settings.autoPassCalls) ask = false;
      }
      if (ask) { dec[humanSeat] = await humanReact(p, humanSeat); App.await = null; }
      else dec[humanSeat] = { a: 'pass' };
      if (token !== App.token) return;
    }
    const A = ZP.resolveReact(G, p, dec);
    if (A.a !== 'pass') { await pace(token); if (token !== App.token) return; }
    try { ZP.act(G, A); } catch (e) { toast(e.message); try { ZP.act(G, { a: 'pass' }); } catch (e2) {} }
    renderTable();
  }
}
function onTableClick(e){
  const G = App.G; if (!G) return;
  const t = e.target.closest('[data-tile],[data-act],[data-tb],[data-goto]');
  if (!t) return;
  if (t.dataset.goto) { setView(t.dataset.goto); return; }
  if (t.dataset.tb) return onToolbar(t.dataset.tb, t);
  const aw = App.await; if (!aw) return;
  const R = G.rules;
  if (t.dataset.tile != null && aw.kind === 'turn') {
    const id = +t.dataset.tile, K = G.K, s = aw.p.seat;
    const A = { a: 'd', s, t: ZP.idCode(id, R) }; if (id === K.drawn) A.g = 1;
    if (aw.riichiMode) A.r = 1;
    aw.res(A); return;
  }
  const act = t.dataset.act;
  if (aw.kind === 'turn') {
    const s = aw.p.seat;
    if (act === 'tsumo') aw.res({ a: 'tsumo', s });
    else if (act === 'riichi') { aw.riichiMode = true; renderTable(); }
    else if (act === 'cancelRiichi') { aw.riichiMode = false; renderTable(); }
    else if (act === 'ankan') aw.res({ a: 'ankan', s, t: ZP.typeCode(+t.dataset.t) });
    else if (act === 'kakan') { const id = G.K.hands[s].find(x => ZP.tType(x) === +t.dataset.t); aw.res({ a: 'kakan', s, t: ZP.idCode(id, R) }); }
    else if (act === 'kyuushu') aw.res({ a: 'kyuushu', s });
  } else if (aw.kind === 'react') {
    const o = aw.p.opts[aw.seat];
    if (act === 'ron') aw.res({ a: 'ron' });
    else if (act === 'pon') aw.res({ a: 'pon', use: o.pon[+t.dataset.i].use });
    else if (act === 'chi') aw.res({ a: 'chi', use: o.chi[+t.dataset.i].use });
    else if (act === 'minkan') aw.res({ a: 'minkan' });
    else if (act === 'pass') aw.res({ a: 'pass' });
  }
}
function onTableChange(e){
  const t = e.target; const k = t.dataset.tg;
  if (k === 'hint') { App.settings.hint = t.checked; saveSettings(); if (App.await && App.await.kind === 'turn' && t.checked && !App.await.hintText) { const h = hintFor(App.G, App.await.p.seat, App.await.p); App.await.rec = h.rec; App.await.hintText = h.txt; } renderTable(); }
  else if (k === 'showHands') { App.showHands = t.checked; renderTable(); }
  else if (k === 'autoPassCalls' || k === 'stopOnResult') { App.settings[k] = t.checked; saveSettings(); }
  else if (k === 'speed') { App.settings.speed = 1500 - +t.value; saveSettings(); }
  else if (k === 'viewSeat') { App.viewSeat = +t.value; renderTable(); }
  else if (t.dataset.tb === 'rKyoku') replayGoKyoku(+t.value);
}
async function onToolbar(k){
  if (k === 'pause') { App.paused = !App.paused; renderTable(); }
  else if (k === 'step') { App.stepOnce = true; }
  else if (k === 'quit') {
    const v = await openOverlay(`<h3>対局をやめますか</h3><p>ここまでの牌譜は、保存すれば「履歴」からエクスポートやリプレイができます。</p>
      <div class="ovbtns"><button class="btn" data-ov="close">続ける</button><button class="btn warn" data-ov="discard">保存せずにやめる</button><button class="btn pri" data-ov="save">保存してやめる</button></div>`);
    if (v === 'save') saveToHistory(App.G);
    if (v === 'save' || v === 'discard') { App.token++; App.G = null; App.await = null; App.mode = null; renderTable(); }
  }
  else if (k === 'saveNow') { saveToHistory(App.G); }
  else if (k.startsWith('r') || k === 'takeover' || k === 'closeReplay') replayToolbar(k);
}
function saveToHistory(G, silent){
  const log = JSON.parse(JSON.stringify(G.log));
  log.players = G.players; log.final = G.final;
  log.savedAt = new Date().toISOString();
  const i = App.history.findIndex(h => h.id === log.id);
  if (i >= 0) App.history[i] = log; else App.history.unshift(log);
  if (!store.set('zp.history', App.history)) {
    if (i < 0) App.history.shift(); else App.history[i] = log;
    toast('ブラウザの保存容量が足りません。履歴を整理してください', 4000); return false;
  }
  if (!silent) toast('履歴に保存しました');
  return true;
}

/* ----- results ----- */
function winHandHTML(w, R){

}
const ZERO_YAKU = new Set(['零頭','零刻','零門','双零門','三零門','四零門','零三色','零全帯幺','零混老頭','零七対子','零元','双元帰零','三元帰零','零風','二風帰零','三風帰零','零小四喜','四極帰零','零字一色','大零字一色','零九蓮宝燈','十四無双']);

function resultHTML(G, res){

    }

    const ur = (res.ura || []).map(d => idHTML(d.id, R, { cls: 'sm' + (d.valid ? '' : ' inv') })).join('');

  } else {

  }

}
function finalHTML(G){
  const F = G.final; if (!F) return '';

  return `<h3>終局</h3><div class="scroll"><table class="dt"><tr><th>順位</th><th>プレイヤー</th><th class="num">持ち点</th><th class="num">ポイント</th></tr>
    ${order.map(s => `<tr><td>${F.ranks[s] + 1}位</td><td>${esc(G.players[s].name)}</td><td class="num">${fmt(F.scores[s])}</td><td class="num ${F.points[s] >= 0 ? 'pos' : 'neg'}">${F.points[s] > 0 ? '+' : ''}${F.points[s].toFixed(1)}</td></tr>`).join('')}</table></div>`;
}
async function showKyokuResult(G, res, token){
  const auto = App.mode === 'watch' && !App.settings.stopOnResult;
  const p = openOverlay(`${resultHTML(G, res)}<div class="ovbtns">${App.mode === 'watch' ? '<button class="btn" data-ov="pause">止める</button>' : ''}<button class="btn pri" data-ov="next">次へ</button></div>`);
  if (auto) {
    const tm = setTimeout(() => { if (ovResolve && token === App.token) closeOverlay('next'); }, Math.max(1800, App.settings.speed * 4));
    const v = await p; clearTimeout(tm);
    if (v === 'pause') { App.paused = true; renderTable(); }
  } else await p;
}
async function onGameOver(){
  const G = App.G;
  if (App.settings.autoSave) saveToHistory(G, true);
  renderTable();
  const v = await openOverlay(`${finalHTML(G)}<p class="small mute">${App.settings.autoSave ? '牌譜は「履歴」に保存しました。' : ''}</p>
    <div class="ovbtns"><button class="btn" data-ov="replay">リプレイで見る</button>${App.settings.autoSave ? '' : '<button class="btn" data-ov="save">履歴に保存</button>'}<button class="btn" data-ov="close">卓を閉じる</button><button class="btn pri" data-ov="again">同じ設定でもう一局</button></div>`);
  const log = JSON.parse(JSON.stringify(G.log));
  if (v === 'save') saveToHistory(G);
  if (v === 'replay') { openReplay(log); return; }
  if (v === 'again') { const players = G.players.map(p => Object.assign({}, p)); startLive(App.mode, players, App.humanSeat); return; }
  App.token++; App.G = null; App.mode = null; renderTable();
}

/* ----- replay ----- */
function openReplay(log){
  App.token++;
  let R;
  try { R = ZP.Replayer(log); } catch (e) { toast('牌譜を開けません：' + e.message, 4500); return; }
  App.replay = { log, R, auto: false, timer: null };
  App.G = R.G; App.mode = 'replay'; App.humanSeat = -1; App.viewSeat = 0; App.showHands = true; App.await = null;
  setView('table');
}
function replaySync(){ App.G = App.replay.R.G; renderTable(); }
function replayNext(){
  const RP = App.replay, r = RP.R.step();
  if (r === 'error') { toast(RP.R.error, 5000); stopAuto(); }
  if (r === 'stop') stopAuto();
  replaySync();
  return r;
}
function replayTo(steps){
  const R = App.replay.R; R.reset();
  let guard = 0;
  while (R.steps < steps && guard++ < 100000) { const r = R.step(); if (r === 'stop' || r === 'error') break; }
}
function replayGoKyoku(k){
  const R = App.replay.R; R.reset(); stopAuto();
  let guard = 0;
  while (R.ki < k && guard++ < 100000) { const r = R.step(); if (r === 'stop' || r === 'error') break; }
  replaySync();
}
function stopAuto(){ const RP = App.replay; if (RP && RP.timer) { clearInterval(RP.timer); RP.timer = null; RP.auto = false; } }
async function replayToolbar(k){
  const RP = App.replay; if (!RP) return; const R = RP.R;
  if (k === 'rNext') { stopAuto(); replayNext(); }
  else if (k === 'rBack') { stopAuto(); if (R.steps > 0) { replayTo(R.steps - 1); replaySync(); } }
  else if (k === 'rkStart') {
    stopAuto();
    const target = R.ki; R.reset(); let g = 0;
    while (R.ki < target && g++ < 100000) { const r = R.step(); if (r === 'stop' || r === 'error') break; }
    replaySync();
  }
  else if (k === 'rkEnd') {
    stopAuto(); let g = 0;
    if (ZP.pending(R.G).kind === 'end') { replayNext(); }
    while (ZP.pending(R.G).kind !== 'end' && g++ < 5000) { const r = R.step(); if (r === 'stop' || r === 'error') break; }
    replaySync();
  }
  else if (k === 'rAuto') {
    if (RP.auto) stopAuto();
    else { RP.auto = true; RP.timer = setInterval(() => { if (App.mode !== 'replay') return stopAuto(); const r = replayNext(); if (r === 'stop' || r === 'error') { stopAuto(); renderTable(); } }, Math.max(150, App.settings.speed)); }
    renderTable();
  }
  else if (k === 'closeReplay') { stopAuto(); App.replay = null; App.G = null; App.mode = null; setView('replay'); }
  else if (k === 'takeover') {
    stopAuto();
    if (R.G.over) { toast('この対局は終局しています'); return; }
    const P = R.G.players;
    const v = await openOverlay(`<h3>ここから操作する</h3><p>現在の局面から牌譜とは別の進行で続けます。元の牌譜は変わりません。</p>

function newStats(names){
  return {
    games: 0, kyokus: 0, wins: 0, tsumo: 0, draws: 0, aborts: {}, yaku: {}, han: {}, zeroWins: 0, zeroPts: 0, nzPts: 0, ym: {}, doubleRon: 0,
    pl: names.map(n => ({ name: n, ranks: [0, 0, 0, 0], pts: 0, score: 0, wins: 0, tsumo: 0, dealin: 0, riichi: 0, called: 0, hands: 0, winPts: 0, zeroWins: 0 })),
    t0: Date.now(), t1: 0
  };
}
function addStats(st, G, slotOf){
  st.games++;
  for (const L of G.log.kyokus) {
    if (!L.result) continue;
    st.kyokus++;
  }
  // 詳細は各局の結果(エンジン内)から再計算: ログ結果 + 局ごとの立直/副露は K に無いので履歴に保持
  for (const rr of G._res || []) {
    for (let s = 0; s < 4; s++) { const P = st.pl[slotOf(s)]; P.hands++; if (rr.riichi[s]) P.riichi++; if (rr.called[s]) P.called++; }
    if (rr.type === 'agari') {
      if (rr.wins.length > 1) st.doubleRon++;
      for (const w of rr.wins) {
        st.wins++; const P = st.pl[slotOf(w.seat)]; P.wins++; P.winPts += w.gain;
        if (w.tsumo) { st.tsumo++; P.tsumo++; } else st.pl[slotOf(w.from)].dealin++;
        const hk = w.ym ? (w.ym > 1 ? w.ym + '倍役満' : '役満') : (w.han >= 13 ? '13+' : String(w.han));
        st.han[hk] = (st.han[hk] || 0) + 1;
        if (w.usesZero) { st.zeroWins++; st.zeroPts += w.gain; P.zeroWins++; } else st.nzPts += w.gain;
        for (const y of w.yaku) st.yaku[y[0]] = (st.yaku[y[0]] || 0) + 1;
        if (w.dora) st.yaku['ドラ'] = (st.yaku['ドラ'] || 0) + 1;
        if (w.red) st.yaku['赤ドラ'] = (st.yaku['赤ドラ'] || 0) + 1;
        if (w.ura) st.yaku['裏ドラ'] = (st.yaku['裏ドラ'] || 0) + 1;
      }
    } else { st.draws++; st.aborts[rr.reason] = (st.aborts[rr.reason] || 0) + 1; }
  }
  for (let s = 0; s < 4; s++) { const P = st.pl[slotOf(s)]; P.ranks[G.final.ranks[s]]++; P.pts += G.final.points[s]; P.score += G.final.scores[s]; }
}
function runGameCollect(G, styleOf){
  G._res = [];
  if (!G.K) ZP.startKyoku(G);
  let n = 0;
  while (!G.over && n++ < 100000) {
    const p = ZP.pending(G);
    if (p.kind === 'end') { const r = p.result; G._res.push({ type: r.type, reason: r.reason, riichi: r.riichi, called: r.called, wins: r.wins ? r.wins.map(w => ({ seat: w.seat, from: w.from, tsumo: w.tsumo, gain: w.gain, han: w.han, ym: w.ym, usesZero: w.usesZero, yaku: w.yaku, dora: w.dora, red: w.red, ura: w.ura })) : null }); ZP.nextKyoku(G); continue; }
    if (p.kind === 'turn') { ZP.act(G, ZP.AI.turn(G, p, styleOf(p.seat))); continue; }
    const dec = {}; for (const s in p.opts) dec[s] = ZP.AI.react(G, +s, p.opts[s], styleOf(+s));
    ZP.act(G, ZP.resolveReact(G, p, dec));
  }
  if (!G.over) throw new Error('対局が終わりませんでした');
}
async function runSim(){
  const n = Math.max(1, Math.min(5000, parseInt($('#smN').value, 10) || 1));
  const seedIn = $('#smSeed').value.trim();
  const baseSeed = seedIn ? (parseInt(seedIn, 10) >>> 0) : Math.floor(Math.random() * 2 ** 31);
  const styles = [0, 1, 2, 3].map(i => document.querySelector(`[data-st="sm${i}"]`).value);
  const rotate = $('#smRot').checked, keep = $('#smKeep').checked, toHist = $('#smHist').checked;
  store.set('zp.sim', { n, seed: seedIn, styles, rotate, keep, toHist });
  const names = styles.map((st, i) => `CPU${'ABCD'[i]}（${ZP.STYLES[st]}）`);
  const st = newStats(names);
  App.sim = { stop: false, logs: [], stats: st, baseSeed, styles, rules: Object.assign({}, App.settings.rules) };
  $('#smRun').disabled = true; $('#smStop').disabled = false;
  const bar = $('#smBar'), stat = $('#smStat');
  let last = performance.now();
  let failed = 0;
  for (let g = 0; g < n; g++) {
    if (App.sim.stop) break;
    const off = rotate ? g % 4 : 0;
    const slotOf = s => (s - off + 4) % 4; // 席s に座るのは slot (s-off)
    const players = [0, 1, 2, 3].map(s => ({ name: names[slotOf(s)], type: 'cpu', style: styles[slotOf(s)] }));
    const G = ZP.newGame({ rules: App.sim.rules, players, seed: (baseSeed + g * 7919) >>> 0, mode: 'sim', title: `シミュレーション #${g + 1}` });
    try { runGameCollect(G, s => styles[slotOf(s)]); }
    catch (e) { failed++; console.error(e); continue; }
    addStats(st, G, slotOf);
    if (keep || toHist) { const L = JSON.parse(JSON.stringify(G.log)); L.final = G.final; if (keep) App.sim.logs.push(L); if (toHist) { L.savedAt = new Date().toISOString(); App.history.unshift(L); } }
    if (performance.now() - last > 60) {
      bar.style.width = ((g + 1) / n * 100) + '%'; stat.textContent = `${g + 1} / ${n} 対局`;
      await sleep(0); last = performance.now();
    }
  }
  st.t1 = Date.now();
  if (toHist && !store.set('zp.history', App.history)) { App.history = store.get('zp.history', []); toast('保存容量が足りず、履歴への保存はできませんでした', 4500); }
  bar.style.width = '100%';
  stat.textContent = `${st.games} 対局完了（${((st.t1 - st.t0) / 1000).toFixed(1)}秒）${App.sim.stop ? '・中止しました' : ''}${failed ? `・${failed}対局でエラー` : ''}`;
  $('#smRun').disabled = false; $('#smStop').disabled = true;
  renderSimResult();
}
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '—';
function simCSV(){
  const st = App.sim.stats; const L = [];
  L.push(['player', 'games', 'avg_rank', 'rank1', 'rank2', 'rank3', 'rank4', 'avg_point', 'avg_score', 'win_rate', 'dealin_rate', 'riichi_rate', 'call_rate', 'avg_win', 'zero_wins'].join(','));
  st.pl.forEach(P => { const g = P.ranks.reduce((a, b) => a + b, 0); L.push([P.name, g, (P.ranks.reduce((a, r, i) => a + r * (i + 1), 0) / g).toFixed(3), ...P.ranks, (P.pts / g).toFixed(2), Math.round(P.score / g), (P.wins / P.hands).toFixed(4), (P.dealin / P.hands).toFixed(4), (P.riichi / P.hands).toFixed(4), (P.called / P.hands).toFixed(4), P.wins ? Math.round(P.winPts / P.wins) : 0, P.zeroWins].join(',')); });
  L.push(''); L.push('yaku,count,per_win');
  Object.entries(st.yaku).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => L.push(`${k},${v},${(v / st.wins).toFixed(4)}`));
  L.push(''); L.push('han,count');
  Object.entries(st.han).forEach(([k, v]) => L.push(`${k},${v}`));
  return '\ufeff' + L.join('\n');
}

/* ----- calculator ----- */
function parseMelds(str){
  const out = [];
  for (const tok of str.split(/[\s,、]+/).filter(Boolean)) {
    const k = tok[0].toLowerCase();
    if (!'cpka'.includes(k)) throw new Error(`副露「${tok}」の先頭に c/p/k/a を付けてください`);
    const ts = ZP.parseHandStr(tok.slice(1));
    const types = ts.map(x => x.t);
    if (k === 'c') {
      if (types.length !== 3) throw new Error(`チー「${tok}」は3枚です`);
      const s = types.slice().sort((a, b) => a - b);
      let m;
      if (s.includes(34)) { const o = s.filter(t => t !== 34); if (o.length !== 2 || o[1] - o[0] !== 8 || o[0] % 9 !== 0) throw new Error(`「${tok}」は 9-0-1 の形ではありません`); m = { k: 'z', t: o[0], open: true }; }
      else { if (s[0] >= 27 || ((s[0] / 9) | 0) !== ((s[2] / 9) | 0) || s[1] !== s[0] + 1 || s[2] !== s[0] + 2) throw new Error(`「${tok}」は順子ではありません`); m = { k: 's', t: s[0], open: true }; }
      out.push({ m, ts });
    } else {
      const n = k === 'p' ? 3 : 4;
      if (types.length !== n || types.some(t => t !== types[0])) throw new Error(`「${tok}」は同じ牌${n}枚にしてください`);
      out.push({ m: { k: k === 'p' ? 't' : 'k', t: types[0], open: k !== 'a' }, ts });
    }
  }
  return out;
}

function calcRun(){
  const out = $('#cOut');
  try {
    const R = App.settings.rules;
    const hand = ZP.parseHandStr($('#cHand').value);
    const melds = parseMelds($('#cMeld').value);
    const n = hand.length + melds.length * 3;
    const flags = {}; $$('[data-cf]').forEach(c => flags[c.dataset.cf] = c.checked);
    const tsumo = document.querySelector('[name=cWay]:checked').value === 'tsumo';
    const seat = +$('#cSeat').value, round = +$('#cRound').value, dealer = seat === 0;
    const dInd = ZP.parseHandStr($('#cDora').value).map(x => x.t), uInd = ZP.parseHandStr($('#cUra').value).map(x => x.t);
    const doraT = dInd.filter(t => t !== 34).map(ZP.doraNext), uraT = uInd.filter(t => t !== 34).map(ZP.doraNext);
    const red = hand.filter(x => x.red).length + melds.reduce((a, m) => a + m.ts.filter(x => x.red).length, 0);
    const all = hand.map(x => x.t).concat(...melds.map(m => m.ts.map(x => x.t)));
    const cnt = ZP.countsOfTypes(all);
    for (let t = 0; t < 35; t++) if (cnt[t] > 4) throw new Error(`${ZP.typeName(t)}が5枚以上あります`);
    const ctxBase = c => ({ rules: R, c, melds: melds.map(m => m.m), tsumo, seatW: 27 + seat, roundW: 27 + round,
      riichi: flags.riichi || flags.dbl, dbl: flags.dbl, ippatsu: flags.ippatsu, haitei: tsumo && flags.haitei, houtei: !tsumo && flags.houtei,
      rinshan: tsumo && flags.rinshan, chankan: !tsumo && flags.chankan, tenhou: tsumo && flags.tenhou, chiihou: tsumo && flags.chiihou,
      doraT, uraT, red });
    const pay = r => {
      if (tsumo) return dealer ? `${fmt(ZP.ceil100(r.base * 2))}点オール` : `${fmt(ZP.ceil100(r.base))}・${fmt(ZP.ceil100(r.base * 2))}点`;
      return `${fmt(ZP.ceil100(r.base * (dealer ? 6 : 4)))}点`;
    };
    const handView = `<div class="whand"><span class="tiles">${hand.map(x => tileHTML(x.t, { red: x.red })).join('')}</span>${melds.map(m => `<span class="tiles">${m.ts.map(x => tileHTML(x.t, { red: x.red })).join('')}</span>`).join('')}</div>`;
    if (n === 14) {
      const win = $('#cWin').value.trim() ? ZP.parseHandStr($('#cWin').value)[0].t : hand[hand.length - 1].t;
      const c = ZP.countsOfTypes(hand.map(x => x.t));
      if (!c[win]) throw new Error('和了牌が手牌に含まれていません');
      const ctx = Object.assign(ctxBase(c), { win });
      if (!ZP.isAgariAny(c.slice(), melds.length)) { out.innerHTML = handView + '<p><b>和了形ではありません。</b></p>' + shantenNote(c, melds.length); return; }
      const r = ZP.evalHand(ctx);
      if (!r) { out.innerHTML = handView + '<p><b>和了形ですが役がありません。</b></p>'; return; }
      out.innerHTML = handView + calcResultHTML(r, pay(r), dealer, tsumo);
    } else if (n === 13) {
      const c = ZP.countsOfTypes(hand.map(x => x.t));
      const ws = ZP.waitsOf(c.slice(), melds.length, cnt);
      if (!ws.length) { out.innerHTML = handView + '<p><b>聴牌していません。</b></p>' + shantenNote(c, melds.length); return; }
      let h = handView + `<p><b>聴牌</b>　待ち ${ws.length}種</p><div class="scroll"><table class="dt"><tr><th>待ち</th><th>役</th><th class="num">翻符</th><th class="num">点数</th></tr>`;
      for (const w of ws) {
        const c2 = c.slice(); c2[w]++;
        const r = ZP.evalHand(Object.assign(ctxBase(c2), { win: w }));
        h += `<tr><td>${tileHTML(w, { cls: 'sm' })}</td><td style="white-space:normal">${r ? r.yaku.map(y => esc(y[0])).join('、') + (r.usesZero ? ' <span class="x0">×0</span>' : '') : '<span class="neg">役なし</span>'}</td><td class="num">${r ? (r.ym ? esc(r.level) : `${r.han}翻${r.fu}符`) : ''}</td><td class="num">${r ? pay(r) : ''}</td></tr>`;
      }
      out.innerHTML = h + '</table></div>';
    } else {
      out.innerHTML = handView + `<p class="mute">手牌と副露（1組3枚と数えます）で13枚か14枚にしてください。現在 ${n} 枚。</p>`;
    }
  } catch (e) { out.innerHTML = `<p class="neg">${esc(e.message)}</p>`; }
}
function shantenNote(c, mN){ const s = ZP.shanten(c, mN); return `<p class="small mute">${s <= 0 ? '' : s + '向聴'}</p>`; }
function calcResultHTML(r, payTxt, dealer, tsumo){
  const WN = { tanki: '単騎', shanpon: 'シャンポン', kanchan: '嵌張', penchan: '辺張', ryanmen: '両面', z901: '901待ち' };
  let h = `<div class="wt">${r.usesZero ? '零牌を使った和了 <span class="x0">×0</span>' : '通常の和了'}　${r.form === 'chiitoi' ? '七対子形' : r.form === 'kokushi' ? '国士形' : r.form === 'fourteen' ? '十四無双形' : '面子手'}${r.wait ? `・${WN[r.wait]}` : ''}</div>`;
  if (r.d) {
    const sets = r.d.sets.map(s => `<span class="tiles">${ZP.setTypes(s).map(t => tileHTML(t, { cls: 'sm' })).join('')}</span>`).join(' ');
    h += `<div class="whand"><span class="tiles">${tileHTML(r.d.pair, { cls: 'sm' })}${tileHTML(r.d.pair, { cls: 'sm' })}</span> ${sets}</div>`;
  }
  h += yakuTable(r);
  h += `<div class="wsum">${r.ym ? esc(r.level) : `${r.fu}符 ${r.han}翻 ${esc(r.level)}`}　<b>${payTxt}</b>　<span class="small mute">${dealer ? '親' : '子'}・${tsumo ? 'ツモ' : 'ロン'}</span></div>`;
  if (!r.ym && r.fuD && r.fuD.length) h += `<h3>符の内訳</h3><table class="yk">${r.fuD.map(f => `<tr><td>${esc(f[0])}</td><td>${f[1]}符</td></tr>`).join('')}</table>`;
  return h;
}

  <h3>零役一覧</h3>
  <div class="yaku-list">${YAKU_DOC.map(y => `<div title="${esc(y[2])}"><span class="z">${y[0]}</span><span>${y[1]}</span></div>`).join('')}</div>
  <div class="panel" style="margin-top:10px"><table class="yk">${YAKU_DOC.map(y => `<tr class="zy"><td>${y[0]}</td><td style="text-align:left;white-space:normal">${esc(y[2])}</td></tr>`).join('')}</table></div>
  <h3>このサイトでの解釈・実装上の取り決め</h3>
  <ul class="small">
    <li>同系統の段階役は最上位のみ：零門→双零門→三零門→四零門、零風→二風帰零→三風帰零、零元→双元帰零。零全帯幺は零混老頭と同系統として扱い、零混老頭が付くときは数えません。</li>
    <li>零刻は零元・双元帰零・零風・二風帰零・三風帰零・零小四喜・大零字一色・三元帰零が付くとき数えません。役牌は別に加算します。</li>
    <li>三元帰零は大三元を、零小四喜は小四喜を、四極帰零は大四喜と零字一色を置き換えます。大零字一色は零小四喜・三元帰零が成立すれば数えません。それ以外の異なる役満は「役満の複合」設定に従って合算します。</li>
    <li>零全帯幺・零混老頭は零牌を使った和了のときだけ成立します（零牌がなければ通常のチャンタ・混老頭）。</li>
    <li>零九蓮宝燈は 00011123456789 の14枚ちょうど（門前・副露なし）で成立します。</li>
    <li>カンドラは即めくり。裏ドラ表示牌が零牌のとき、その裏ドラは無効です。</li>
    <li>流し満貫・西入・責任払い・国士/十四無双の暗槓搶槓はありません。本場と供託は上家取り（ロン者のうち放銃者に近い人）です。</li>
    <li>聴牌料は形式聴牌（役なしでも可）。自分で4枚使っている牌だけを待つ形は聴牌と見なしません。</li>
  </ul>
  <h3>牌譜の形式</h3>
  <p class="small">JSON形式。<code>games</code> 配列に1試合ずつ入ります。各局は <code>wall</code>（140枚の山。0〜51が配牌、52〜125がツモ、126〜129が嶺上、130〜134がドラ表示、135〜139が裏ドラ表示）と <code>actions</code>（打牌・鳴きなどの操作列）で再現されます。牌は 1m〜9m / 1p〜9p / 1s〜9s / 1z〜7z（東南西北白發中）/ 0（零牌）/ r5m（赤5）。空の牌譜テンプレートは「リプレイ」からエクスポートできます。</p>
  </div>`;
  $$('[data-rule]', root).forEach(el => el.onchange = () => {
    const k = el.dataset.rule;
    if (k === 'autoSave') { S.autoSave = el.checked; }
    else if (el.type === 'checkbox') R[k] = el.checked;
    else if (k === 'uma') { const [a, b] = el.value.split(',').map(Number); R.uma = [b, a, -a, -b]; }
    else if (k === 'start' || k === 'ret') { const v = parseInt(el.value, 10); if (v > 0) R[k] = v; }
    else R[k] = el.value;
    saveSettings();
  });
  $$('[data-set]', root).forEach(el => el.onchange = () => {
    const k = el.dataset.set;
    if (k === 'cpuDelay') S.cpuDelay = Math.max(0, parseInt(el.value, 10) || 0);
    if (k === 'theme') { S.theme = el.value; applyTheme(); }
    saveSettings();
  });
}
function applyTheme(){ const t = App.settings.theme; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

/* ----- init ----- */
function init(){
  applyTheme();
  $$('nav.tabs button').forEach(b => b.onclick = () => setView(b.dataset.view));
  const tb = $('#v-table');
  tb.addEventListener('click', onTableClick);
  tb.addEventListener('change', onTableChange);
  tb.addEventListener('input', e => { if (e.target.dataset.tg === 'speed') onTableChange(e); });
  $('#ov').addEventListener('click', e => {
    const b = e.target.closest('[data-ov]');
    if (b) closeOverlay(b.dataset.ov);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#ov').hidden && $('[data-ov="close"]', $('#ov'))) closeOverlay('close');
    if (App.mode === 'replay' && $('#ov').hidden && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
      if (e.key === 'ArrowRight') { e.preventDefault(); replayToolbar('rNext'); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); replayToolbar('rBack'); }
    }
  });
  setView('table');
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
